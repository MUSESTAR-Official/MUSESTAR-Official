name: Update profile cards

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_cards.py
      - assets/brand/**
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'MUSESTAR-Official/MUSESTAR-Official'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check card generation
        run: python -m unittest discover -s tests -v
      - name: Generate cards from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/profile_cards.py
      - name: Save refreshed cards
        run: |
          git add assets/profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile cards'
          git pull --rebase origin main
          git push origin HEAD:main
